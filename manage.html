<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Schulfilm 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Mulish:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0f0f0f; --surface:#1a1a1a; --border:#2a2a2a;
      --accent:#e8ff4d; --pop:#ff5c35; --text:#f0f0f0; --muted:#666;
    }
    body { background:var(--bg); color:var(--text); font-family:'Mulish',sans-serif; min-height:100vh; }

    /* LOGIN */
    #loginScreen { position:fixed; inset:0; background:var(--bg); z-index:500; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .login-box { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2.5rem 2rem; width:100%; max-width:380px; text-align:center; }
    .login-box .icon { font-size:2.5rem; margin-bottom:1rem; }
    .login-box h1 { font-family:'Syne',sans-serif; font-size:1.6rem; font-weight:800; margin-bottom:0.3rem; }
    .login-box p  { color:var(--muted); font-size:0.88rem; margin-bottom:1.5rem; }
    input[type="password"] { width:100%; background:var(--bg); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-family:'Mulish',sans-serif; font-size:1rem; padding:0.75rem 1rem; margin-bottom:0.75rem; outline:none; transition:border-color 0.2s; text-align:center; letter-spacing:0.15em; }
    input[type="password"]:focus { border-color:var(--accent); }
    .role-tabs { display:flex; gap:0.5rem; margin-bottom:1rem; }
    .role-tab { flex:1; background:var(--bg); border:1.5px solid var(--border); color:var(--muted); padding:0.5rem; border-radius:8px; font-family:'Mulish',sans-serif; font-size:0.82rem; font-weight:600; cursor:pointer; transition:all 0.2s; }
    .role-tab.active { border-color:var(--accent); color:var(--accent); }
    .btn-primary { width:100%; background:var(--accent); color:#0f0f0f; border:none; border-radius:10px; padding:0.85rem; font-family:'Syne',sans-serif; font-weight:700; font-size:0.95rem; cursor:pointer; transition:opacity 0.2s; }
    .btn-primary:hover { opacity:0.85; }
    .login-error { color:var(--pop); font-size:0.82rem; margin-top:0.5rem; min-height:1.2em; }

    #app { display:none; }

    /* NAV */
    nav { background:var(--surface); border-bottom:1px solid var(--border); padding:0 1.5rem; display:flex; align-items:center; justify-content:space-between; height:60px; position:sticky; top:0; z-index:100; }
    .nav-brand { font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; display:flex; align-items:center; gap:0.5rem; }
    .nav-brand span { color:var(--accent); }
    .role-badge { background:rgba(232,255,77,0.12); border:1px solid rgba(232,255,77,0.25); color:var(--accent); border-radius:6px; padding:0.2rem 0.6rem; font-size:0.72rem; font-weight:700; letter-spacing:0.05em; }
    .role-badge.co { background:rgba(255,92,53,0.1); border-color:rgba(255,92,53,0.25); color:var(--pop); }
    .nav-right { display:flex; gap:0.75rem; align-items:center; }
    .btn-nav-link { background:none; border:1px solid var(--border); color:var(--muted); padding:0.3rem 0.7rem; border-radius:8px; font-size:0.78rem; cursor:pointer; font-family:'Mulish',sans-serif; font-weight:500; text-decoration:none; transition:all 0.2s; }
    .btn-nav-link:hover { border-color:var(--pop); color:var(--pop); }

    /* PAGE */
    .page { max-width:1200px; margin:0 auto; padding:2rem 1.5rem; }

    /* STATS */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:0.75rem; margin-bottom:2rem; }
    .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.25rem; }
    .stat-card .num { font-family:'Syne',sans-serif; font-size:2.2rem; font-weight:800; color:var(--accent); line-height:1; }
    .stat-card .lbl { font-size:0.75rem; color:var(--muted); margin-top:0.3rem; }

    /* CONTROLS */
    .controls { display:flex; flex-wrap:wrap; gap:0.75rem; align-items:center; margin-bottom:1.5rem; }
    .chip { background:var(--surface); border:1.5px solid var(--border); color:var(--muted); padding:0.35rem 0.9rem; border-radius:99px; font-size:0.78rem; font-weight:600; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
    .chip:hover, .chip.active { border-color:var(--accent); color:var(--accent); }
    .search-in { background:var(--surface); border:1.5px solid var(--border); border-radius:99px; padding:0.35rem 1rem; font-size:0.82rem; font-family:'Mulish',sans-serif; outline:none; color:var(--text); transition:border-color 0.2s; width:180px; }
    .search-in:focus { border-color:var(--accent); }

    /* ADMIN ACTIONS */
    .admin-actions { display:flex; flex-wrap:wrap; gap:0.75rem; margin-bottom:2rem; }
    .action-btn { display:flex; align-items:center; gap:0.5rem; padding:0.65rem 1.1rem; border-radius:10px; font-family:'Mulish',sans-serif; font-size:0.85rem; font-weight:600; cursor:pointer; transition:all 0.2s; border:1.5px solid; }
    .action-btn.lock-on  { background:rgba(255,92,53,0.1); border-color:rgba(255,92,53,0.3); color:var(--pop); }
    .action-btn.lock-off { background:rgba(232,255,77,0.08); border-color:rgba(232,255,77,0.25); color:var(--accent); }
    .action-btn.zip { background:var(--surface); border-color:var(--border); color:var(--text); }
    .action-btn.zip:hover { border-color:var(--accent); color:var(--accent); }
    .action-btn:hover { opacity:0.85; }

    /* PERSON OVERVIEW */
    .person-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:0.75rem; margin-bottom:2rem; }
    .person-card { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:1rem; transition:border-color 0.2s; cursor:pointer; }
    .person-card:hover, .person-card.active { border-color:var(--accent); }
    .person-card .pname { font-family:'Syne',sans-serif; font-weight:700; font-size:0.95rem; margin-bottom:0.4rem; }
    .person-card .pcounts { font-size:0.78rem; color:var(--muted); }
    .person-card .pcounts b { color:var(--text); }
    .person-del { margin-top:0.75rem; width:100%; background:rgba(255,92,53,0.08); border:1px solid rgba(255,92,53,0.2); color:var(--pop); border-radius:8px; padding:0.4rem; font-size:0.75rem; cursor:pointer; transition:all 0.2s; font-family:'Mulish',sans-serif; font-weight:600; }
    .person-del:hover { background:rgba(255,92,53,0.15); border-color:var(--pop); }

    /* FILE GRID */
    .file-grid { columns:4 200px; gap:10px; }
    .file-item { break-inside:avoid; margin-bottom:10px; border-radius:10px; overflow:hidden; position:relative; background:var(--surface); border:1px solid var(--border); animation:fadeIn 0.3s ease both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .file-item img, .file-item video { width:100%; display:block; }
    .file-footer { padding:0.5rem 0.75rem; display:flex; align-items:center; justify-content:space-between; gap:0.5rem; }
    .file-info { font-size:0.72rem; }
    .file-info strong { display:block; color:var(--text); font-size:0.78rem; }
    .file-info span { color:var(--muted); }
    .del-btn { background:rgba(255,92,53,0.1); border:1px solid rgba(255,92,53,0.2); color:var(--pop); border-radius:6px; padding:0.25rem 0.55rem; font-size:0.72rem; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
    .del-btn:hover { background:rgba(255,92,53,0.2); border-color:var(--pop); }
    .vid-badge { position:absolute; top:0.4rem; right:0.4rem; background:var(--pop); color:white; border-radius:4px; padding:0.15rem 0.45rem; font-size:0.62rem; font-weight:700; }
    .cat-badge { position:absolute; top:0.4rem; left:0.4rem; background:rgba(0,0,0,0.6); color:rgba(255,255,255,0.85); border-radius:4px; padding:0.15rem 0.45rem; font-size:0.62rem; font-weight:700; backdrop-filter:blur(4px); }

    .empty { text-align:center; padding:4rem; color:var(--muted); }
    .spinner { text-align:center; padding:3rem; color:var(--muted); }

    /* MODAL */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:200; align-items:center; justify-content:center; padding:1rem; backdrop-filter:blur(6px); }
    .modal.open { display:flex; }
    .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:2rem; max-width:360px; width:100%; text-align:center; }
    .modal-box .icon { font-size:2rem; margin-bottom:0.75rem; }
    .modal-box h3 { font-family:'Syne',sans-serif; font-size:1.4rem; font-weight:800; margin-bottom:0.4rem; }
    .modal-box p { color:var(--muted); font-size:0.85rem; margin-bottom:1.5rem; }
    .modal-btns { display:flex; gap:0.75rem; }
    .btn-cancel { flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:0.7rem; font-family:'Mulish',sans-serif; cursor:pointer; transition:border-color 0.2s; }
    .btn-cancel:hover { border-color:var(--text); }
    .btn-confirm-del { flex:1; background:var(--pop); border:none; color:white; border-radius:10px; padding:0.7rem; font-family:'Syne',sans-serif; font-weight:700; cursor:pointer; transition:opacity 0.2s; }
    .btn-confirm-del:hover { opacity:0.85; }

    .toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%) translateY(12px); background:var(--accent); color:#0f0f0f; border-radius:10px; padding:0.6rem 1.4rem; font-size:0.85rem; font-weight:700; opacity:0; transition:all 0.3s; pointer-events:none; z-index:400; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.err { background:var(--pop); color:white; }

    @media(max-width:600px) { .file-grid { columns:2 140px; } nav { padding:0 1rem; } }
  </style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="icon">🔐</div>
    <h1>Admin Login</h1>
    <p>Nur für autorisierte Personen.</p>
    <div class="role-tabs">
      <button class="role-tab active" id="roleSuper" onclick="setRole('super')">⭐ Super-Admin</button>
      <button class="role-tab" id="roleCo" onclick="setRole('co')">👤 Co-Admin</button>
    </div>
    <input type="password" id="loginPw" placeholder="Passwort" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-primary" onclick="doLogin()">Einloggen</button>
    <div class="login-error" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <nav>
    <div style="display:flex;align-items:center;gap:0.75rem">
      <div class="nav-brand">🎬 <span>Admin</span></div>
      <span class="role-badge" id="roleBadge">SUPER</span>
      <span style="color:var(--muted);font-size:0.85rem" id="adminNameLabel"></span>
    </div>
    <div class="nav-right">
      <a href="/" class="btn-nav-link">← Zurück</a>
      <button class="btn-nav-link" onclick="doLogout()">Abmelden</button>
    </div>
  </nav>

  <div class="page">

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="num" id="sTotal">–</div><div class="lbl">Dateien gesamt</div></div>
      <div class="stat-card"><div class="num" id="sImgs">–</div><div class="lbl">Bilder</div></div>
      <div class="stat-card"><div class="num" id="sVids">–</div><div class="lbl">Videos</div></div>
      <div class="stat-card"><div class="num" id="sPersons">–</div><div class="lbl">Personen</div></div>
    </div>

    <!-- ADMIN ACTIONS -->
    <div class="admin-actions" id="adminActions">
      <button class="action-btn zip" onclick="downloadZip('')">⬇ Alles als ZIP</button>
      <button class="action-btn zip" onclick="showPersonZip()">⬇ Person als ZIP</button>
      <button class="action-btn lock-off" id="lockBtn" style="display:none" onclick="toggleLock()">🔒 Upload sperren</button>
    </div>

    <!-- PERSON OVERVIEW -->
    <h3 style="font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:1rem;color:var(--muted)">PERSONEN</h3>
    <div class="person-grid" id="personGrid"></div>

    <!-- FILE CONTROLS -->
    <h3 style="font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:1rem;color:var(--muted)">ALLE DATEIEN</h3>
    <div class="controls">
      <button class="chip active" onclick="setFilter('all',this)">Alle</button>
      <button class="chip" onclick="setFilter('image',this)">🖼️ Bilder</button>
      <button class="chip" onclick="setFilter('video',this)">🎥 Videos</button>
      <input class="search-in" type="text" placeholder="🔍 Suchen…" oninput="setSearch(this.value)">
    </div>
    <div id="fileContent" class="spinner">⏳ Lade Dateien…</div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="icon" id="modalIcon">🗑️</div>
    <h3 id="modalTitle">Löschen?</h3>
    <p id="modalDesc">Diese Aktion kann nicht rückgängig gemacht werden.</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Abbrechen</button>
      <button class="btn-confirm-del" id="modalConfirmBtn" onclick="confirmAction()">Löschen</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let allFiles = [];
let typeFilter = 'all';
let searchQ = '';
let pendingAction = null;
let adminRole = null;
let uploadLocked = false;

// ── AUTH ──────────────────────────────────────────
let selectedRole = 'super';
function setRole(r) {
  selectedRole = r;
  document.getElementById('roleSuper').classList.toggle('active', r==='super');
  document.getElementById('roleCo').classList.toggle('active', r==='co');
}

async function doLogin() {
  const pw  = document.getElementById('loginPw').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';
  const res  = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password:pw, role:'admin'}) });
  const data = await res.json();
  if (res.ok) {
    adminRole = data.role;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('roleBadge').textContent = data.role === 'super' ? '⭐ SUPER-ADMIN' : '👤 CO-ADMIN';
    if (data.role === 'co') document.getElementById('roleBadge').classList.add('co');
    document.getElementById('adminNameLabel').textContent = data.name || '';
    initAdmin();
  } else {
    err.textContent = '❌ Falsches Passwort.';
  }
}

async function doLogout() { await fetch('/logout',{method:'POST'}); location.reload(); }

(async () => {
  const res = await fetch('/api/session');
  const d   = await res.json();
  if (d.admin_role) {
    adminRole = d.admin_role;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('roleBadge').textContent = d.admin_role==='super' ? '⭐ SUPER-ADMIN' : '👤 CO-ADMIN';
    if (d.admin_role==='co') document.getElementById('roleBadge').classList.add('co');
    document.getElementById('adminNameLabel').textContent = d.admin_name || '';
    initAdmin();
  }
})();

// ── INIT ──────────────────────────────────────────
async function initAdmin() {
  if (adminRole === 'super') {
    document.getElementById('lockBtn').style.display = 'flex';
    const lockRes  = await fetch('/api/upload-lock');
    const lockData = await lockRes.json();
    uploadLocked = lockData.locked;
    updateLockBtn();
  }
  loadFiles();
}

// ── FILES ─────────────────────────────────────────
async function loadFiles() {
  const res  = await fetch('/api/admin/files');
  const data = await res.json();
  if (data.status !== 'ok') { document.getElementById('fileContent').innerHTML='<div class="empty">⚠️ Fehler.</div>'; return; }
  allFiles = data.files;
  updateStats();
  buildPersonGrid();
  renderFiles();
}

function updateStats() {
  const imgs    = allFiles.filter(f=>f.type==='image').length;
  const vids    = allFiles.filter(f=>f.type==='video').length;
  const persons = new Set(allFiles.map(f=>f.uploader)).size;
  document.getElementById('sTotal').textContent   = allFiles.length;
  document.getElementById('sImgs').textContent    = imgs;
  document.getElementById('sVids').textContent    = vids;
  document.getElementById('sPersons').textContent = persons;
}

function buildPersonGrid() {
  const counts = {};
  allFiles.forEach(f => {
    if (!counts[f.uploader]) counts[f.uploader] = {img:0,vid:0};
    counts[f.uploader][f.type==='image'?'img':'vid']++;
  });
  const grid = document.getElementById('personGrid');
  grid.innerHTML = Object.entries(counts).sort((a,b)=>(b[1].img+b[1].vid)-(a[1].img+a[1].vid))
    .map(([name,c]) => `
    <div class="person-card" onclick="filterByPerson('${name}',this)">
      <div class="pname">${name}</div>
      <div class="pcounts"><b>${c.img+c.vid}</b> Dateien · ${c.img} Bilder · ${c.vid} Videos</div>
      ${adminRole==='super' ? `<button class="person-del" onclick="event.stopPropagation();askDeletePerson('${name}')">🗑 Alle löschen</button>` : ''}
    </div>`).join('');
}

function filterByPerson(name, card) {
  document.querySelectorAll('.person-card').forEach(c=>c.classList.remove('active'));
  card.classList.add('active');
  searchQ = name;
  document.querySelector('.search-in').value = name;
  renderFiles();
}

function getFiltered() {
  return allFiles.filter(f => {
    const typeOk = typeFilter==='all' || f.type===typeFilter;
    const srchOk = !searchQ || f.uploader.toLowerCase().includes(searchQ.toLowerCase()) || (f.comment||'').toLowerCase().includes(searchQ.toLowerCase());
    return typeOk && srchOk;
  });
}

function renderFiles() {
  const files = getFiltered();
  const el    = document.getElementById('fileContent');
  if (!files.length) { el.className=''; el.innerHTML='<div class="empty">📭 Keine Dateien.</div>'; return; }
  el.className = 'file-grid';
  el.innerHTML = files.map((f,i) => `
    <div class="file-item" style="animation-delay:${Math.min(i*0.02,0.5)}s">
      ${f.type==='video' ? `<video src="${f.url}" muted preload="metadata"></video><span class="vid-badge">VIDEO</span>` : `<img src="${f.url}" loading="lazy">`}
      <span class="cat-badge">${f.category||'?'}</span>
      <div class="file-footer">
        <div class="file-info">
          <strong>${f.uploader}</strong>
          <span>${new Date(f.created).toLocaleDateString('de-DE')}</span>
        </div>
        <button class="del-btn" onclick="askDelete('${f.public_id}','${f.resource_type}','${f.uploader}')">🗑</button>
      </div>
    </div>`).join('');
}

function setFilter(type, btn) {
  typeFilter = type;
  document.querySelectorAll('.controls .chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderFiles();
}
function setSearch(val) { searchQ=val; renderFiles(); }

// ── DELETE SINGLE ─────────────────────────────────
function askDelete(publicId, resourceType, uploader) {
  pendingAction = {type:'file', publicId, resourceType, uploader};
  document.getElementById('modalIcon').textContent  = '🗑️';
  document.getElementById('modalTitle').textContent = 'Datei löschen?';
  document.getElementById('modalDesc').textContent  = `Datei von „${uploader}" wird permanent gelöscht.`;
  document.getElementById('modalConfirmBtn').textContent = 'Löschen';
  document.getElementById('modal').classList.add('open');
}

function askDeletePerson(name) {
  pendingAction = {type:'person', name};
  document.getElementById('modalIcon').textContent  = '🗑️';
  document.getElementById('modalTitle').textContent = `Alle Dateien von ${name} löschen?`;
  document.getElementById('modalDesc').textContent  = 'Alle Uploads dieser Person werden permanent gelöscht.';
  document.getElementById('modalConfirmBtn').textContent = 'Alles löschen';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); pendingAction=null; }

async function confirmAction() {
  if (!pendingAction) return; closeModal();

  if (pendingAction.type === 'file') {
    const res  = await fetch('/api/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({public_id:pendingAction.publicId, resource_type:pendingAction.resourceType, uploader:pendingAction.uploader}) });
    const data = await res.json();
    if (data.status==='ok') { allFiles=allFiles.filter(f=>f.public_id!==pendingAction.publicId); updateStats(); buildPersonGrid(); renderFiles(); showToast('✅ Gelöscht'); }
    else showToast('❌ '+data.message,'err');
  }

  if (pendingAction.type === 'person') {
    const res  = await fetch('/api/delete-person', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name:pendingAction.name}) });
    const data = await res.json();
    if (data.status==='ok') { allFiles=allFiles.filter(f=>f.uploader!==pendingAction.name); updateStats(); buildPersonGrid(); renderFiles(); showToast('✅ Alle Dateien gelöscht'); }
    else showToast('❌ '+data.message,'err');
  }
}

// ── LOCK ──────────────────────────────────────────
function updateLockBtn() {
  const btn = document.getElementById('lockBtn');
  if (uploadLocked) { btn.className='action-btn lock-on'; btn.textContent='🔓 Upload entsperren'; }
  else              { btn.className='action-btn lock-off'; btn.textContent='🔒 Upload sperren'; }
}

async function toggleLock() {
  uploadLocked = !uploadLocked;
  await fetch('/api/upload-lock', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({locked:uploadLocked}) });
  updateLockBtn();
  showToast(uploadLocked ? '🔒 Upload gesperrt' : '🔓 Upload freigegeben');
}

// ── ZIP ───────────────────────────────────────────
function downloadZip(name) {
  const url = '/api/download-zip' + (name ? `?name=${encodeURIComponent(name)}` : '');
  showToast('⏳ ZIP wird erstellt…');
  window.location.href = url;
}

function showPersonZip() {
  const persons = [...new Set(allFiles.map(f=>f.uploader))];
  const name = prompt('Welche Person?\n\n' + persons.join('\n'));
  if (name && persons.includes(name)) downloadZip(name);
  else if (name) showToast('❌ Person nicht gefunden','err');
}

// ── MODAL BACKDROP ────────────────────────────────
document.getElementById('modal').addEventListener('click', e => { if(e.target===document.getElementById('modal')) closeModal(); });

// ── TOAST ─────────────────────────────────────────
function showToast(msg, type='') {
  const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type;
  setTimeout(()=>t.className='toast',3000);
}
</script>
